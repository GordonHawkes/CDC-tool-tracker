<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDC ToolTrack</title>
  <meta name="theme-color" content="#0f1117"/>
  <link rel="manifest" href="./manifest.json"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0f1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .header { 
      background: #161b22; padding: 16px; border-bottom: 1px solid #30363d;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-size: 18px; font-weight: 600; flex: 1; text-align: center; }
    .user-btn { background: #1f6feb; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .content { flex: 1; overflow-y: auto; padding: 16px; max-width: 500px; margin: 0 auto; width: 100%; }
    .login-screen { display: none; }
    .login-screen.show { display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .app-screen { display: none; }
    .app-screen.show { display: block; }
    .logo { width: 80px; height: 80px; margin: 0 auto 24px; border-radius: 12px; background: #1f6feb; display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .title { font-size: 24px; font-weight: 600; margin-bottom: 8px; text-align: center; }
    .subtitle { color: #8b949e; margin-bottom: 24px; text-align: center; }
    .staff-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .staff-item { 
      background: #161b22; border: 1px solid #30363d; padding: 16px; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; gap: 12px;
    }
    .staff-item:active { background: #0d419f; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: white; flex-shrink: 0; }
    .staff-info { flex: 1; }
    .staff-name { font-weight: 600; margin-bottom: 4px; }
    .staff-role { color: #8b949e; font-size: 13px; }
    .add-staff-form { background: #161b22; border: 1px solid #30363d; padding: 16px; border-radius: 8px; margin-top: 16px; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 13px; margin-bottom: 4px; }
    .input-group input, .input-group select { 
      width: 100%; padding: 8px 12px; background: #0d1b2a; border: 1px solid #30363d;
      color: #e6edf3; border-radius: 6px; font-size: 14px;
    }
    .button { 
      width: 100%; padding: 12px; background: #1f6feb; color: white; border: none;
      border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 12px;
    }
    .button:active { background: #0d419f; }
    .button.secondary { background: #30363d; }
    .button.danger { background: #da3633; }
    .tabs { display: flex; gap: 8px; border-bottom: 1px solid #30363d; margin-bottom: 16px; overflow-x: auto; padding-bottom: 8px; }
    .tab { padding: 8px 12px; cursor: pointer; border: none; background: none; color: #8b949e; font-size: 13px; white-space: nowrap; }
    .tab.active { color: #1f6feb; border-bottom: 2px solid #1f6feb; }
    .section-title { font-size: 13px; font-weight: 600; color: #8b949e; margin: 16px 0 8px 0; text-transform: uppercase; }
    .tool-item { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; margin-bottom: 8px; }
    .tool-name { font-weight: 600; margin-bottom: 4px; }
    .tool-status { font-size: 12px; color: #8b949e; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .empty { color: #8b949e; font-style: italic; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div style="width: 40px;"></div>
      <div class="header-title">CDC ToolTrack</div>
      <button class="user-btn" id="userBtn" onclick="logout()"></button>
    </div>
    <div class="content">
      <!-- LOGIN SCREEN -->
      <div class="login-screen show" id="loginScreen">
        <div class="logo">🔧</div>
        <div class="title">CDC ToolTrack</div>
        <div class="subtitle">Tap your name to sign in</div>
        <div class="staff-grid" id="staffGrid"></div>

        <div class="add-staff-form">
          <div style="font-size:14px;font-weight:600;margin-bottom:12px;">➕ Add New Staff</div>
          <div class="input-group">
            <label>Name:</label>
            <input type="text" id="newStaffName" placeholder="Enter name">
          </div>
          <div class="input-group">
            <label>Role:</label>
            <select id="newStaffRole">
              <option>Permanent</option>
              <option>Temporary</option>
              <option>Manager</option>
              <option>Owner</option>
            </select>
          </div>
          <button class="button secondary" onclick="addStaff()">✓ Add Staff</button>
        </div>
      </div>

      <!-- APP SCREEN -->
      <div class="app-screen" id="appScreen">
        <div class="tabs" id="tabBar"></div>

        <!-- CHECKOUT TAB -->
        <div class="tab-content active" id="tab-checkout">
          <div class="section-title">📤 Check Out Tool</div>
          <div class="input-group">
            <label>Tool:</label>
            <select id="selectTool">
              <option value="">Choose tool...</option>
            </select>
          </div>
          <div class="input-group">
            <label>Site:</label>
            <select id="selectSite">
              <option value="">Choose site...</option>
            </select>
          </div>
          <button class="button" onclick="checkout()">✓ Check Out</button>
        </div>

        <!-- RETURN TAB -->
        <div class="tab-content" id="tab-return">
          <div class="section-title">📥 My Tools</div>
          <div id="myTools"></div>
        </div>

        <!-- TOOLS TAB -->
        <div class="tab-content" id="tab-tools">
          <div class="section-title">🔧 All Tools</div>
          <div id="allTools"></div>
          <div class="add-staff-form">
            <div style="font-size:14px;font-weight:600;margin-bottom:12px;">➕ Add Tool</div>
            <div class="input-group">
              <label>Tool Name:</label>
              <input type="text" id="newToolName" placeholder="e.g., Drill">
            </div>
            <button class="button secondary" onclick="addTool()">✓ Add Tool</button>
          </div>
        </div>

        <!-- SITES TAB -->
        <div class="tab-content" id="tab-sites">
          <div class="section-title">🏗️ Job Sites</div>
          <div id="sitesList"></div>
          <div class="add-staff-form">
            <div style="font-size:14px;font-weight:600;margin-bottom:12px;">➕ Add Site</div>
            <div class="input-group">
              <label>Site Name:</label>
              <input type="text" id="newSiteName" placeholder="e.g., Main Site">
            </div>
            <button class="button secondary" onclick="addSite()">✓ Add Site</button>
          </div>
        </div>

        <!-- HISTORY TAB -->
        <div class="tab-content" id="tab-history">
          <div class="section-title">📋 Activity</div>
          <div id="historyList"></div>
        </div>

        <!-- SETTINGS TAB -->
        <div class="tab-content" id="tab-settings">
          <div class="section-title">💾 Backup</div>
          <button class="button secondary" onclick="exportData()">⬇️ Export Backup</button>
          <button class="button secondary" onclick="document.getElementById('importFile').click()">⬆️ Import Backup</button>
          <input type="file" id="importFile" style="display:none" onchange="importData(event)">
          <div class="section-title" style="margin-top:24px;">🔄 Sync Status</div>
          <div id="syncStatus">✅ Ready</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDDaNFeThITc0JZXmFRjG-_vKhDEhQ9CBk",
      authDomain: "cdc-tool-tracker.firebaseapp.com",
      databaseURL: "https://cdc-tool-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cdc-tool-tracker"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = {
      currentUserId: null,
      staff: [],
      tools: [],
      checkouts: [],
      logs: [],
      sites: []
    };

    const KEY = "cdc_tooltrack_v2";

    // STORAGE
    function save() {
      localStorage.setItem(KEY, JSON.stringify(state));
      if (navigator.onLine) syncToFirebase();
    }

    function load() {
      const saved = localStorage.getItem(KEY);
      if (saved) state = JSON.parse(saved);
    }

    async function syncToFirebase() {
      if (!navigator.onLine) return;
      try {
        await db.ref("tooltrack/data").set({
          staff: state.staff,
          tools: state.tools,
          sites: state.sites,
          logs: state.logs,
          lastUpdated: new Date().toISOString()
        });
      } catch(e) {
        console.error("Sync error:", e);
      }
    }

    // LOGIN
    function renderLoginScreen() {
      document.getElementById("loginScreen").classList.add("show");
      document.getElementById("appScreen").classList.remove("show");
      
      const grid = document.getElementById("staffGrid");
      if (state.staff.length === 0) {
        grid.innerHTML = "<p style='color:#8b949e;text-align:center;margin-bottom:24px;'>No staff added yet. Add staff below to get started!</p>";
      } else {
        grid.innerHTML = state.staff.map(u => `
          <div class="staff-item" onclick="login('${u.id}')">
            <div class="avatar" style="background:${getColor(u.id)}">${u.name[0]}</div>
            <div class="staff-info">
              <div class="staff-name">${u.name}</div>
              <div class="staff-role">${u.role}</div>
            </div>
          </div>
        `).join("");
      }
    }

    function addStaff() {
      const name = document.getElementById("newStaffName").value.trim();
      const role = document.getElementById("newStaffRole").value;
      
      if (!name) { alert("Enter a name"); return; }
      
      const id = "staff-" + Date.now();
      state.staff.push({id, name, role});
      save();
      
      document.getElementById("newStaffName").value = "";
      renderLoginScreen();
      alert("✓ Staff added");
    }

    function login(id) {
      state.currentUserId = id;
      save();
      renderAppScreen();
    }

    function logout() {
      state.currentUserId = null;
      save();
      renderLoginScreen();
    }

    // APP
    function renderAppScreen() {
      document.getElementById("loginScreen").classList.remove("show");
      document.getElementById("appScreen").classList.add("show");
      
      const user = state.staff.find(u => u.id === state.currentUserId);
      document.getElementById("userBtn").innerHTML = `<span style="background:${getColor(user.id)};display:inline-block;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;">${user.name[0]}</span> ${user.name.split(" ")[0]}`;
      
      renderTabs();
      updateSelects();
      renderTools();
      renderSites();
    }

    function renderTabs() {
      const tabs = [
        {id: "checkout", label: "📤 Checkout"},
        {id: "return", label: "📥 Return"},
        {id: "tools", label: "🔧 Tools"},
        {id: "sites", label: "🏗️ Sites"},
        {id: "history", label: "📋 History"},
        {id: "settings", label: "⚙️ Settings"}
      ];
      
      document.getElementById("tabBar").innerHTML = tabs.map(t => 
        `<button class="tab ${t.id === 'checkout' ? 'active' : ''}" onclick="showTab('${t.id}')">${t.label}</button>`
      ).join("");
    }

    function showTab(tab) {
      document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("active");
      document.querySelector(`button[onclick="showTab('${tab}')"]`).classList.add("active");
      
      if (tab === "return") renderReturn();
      if (tab === "history") renderHistory();
    }

    function updateSelects() {
      const toolSel = document.getElementById("selectTool");
      const siteSel = document.getElementById("selectSite");
      
      toolSel.innerHTML = "<option value=''>Choose...</option>" + 
        state.tools.filter(t => !t.checkedOutBy).map(t => 
          `<option value="${t.id}">${t.name}</option>`
        ).join("");
      
      siteSel.innerHTML = "<option value=''>Choose...</option>" + 
        state.sites.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
    }

    function addTool() {
      const name = document.getElementById("newToolName").value.trim();
      if (!name) { alert("Enter tool name"); return; }
      
      state.tools.push({id: Date.now(), name, checkedOutBy: null, checkedOutAt: null, checkedOutSite: null});
      save();
      document.getElementById("newToolName").value = "";
      updateSelects();
      renderTools();
      alert("✓ Tool added");
    }

    function addSite() {
      const name = document.getElementById("newSiteName").value.trim();
      if (!name) { alert("Enter site name"); return; }
      
      state.sites.push({id: Date.now(), name});
      save();
      document.getElementById("newSiteName").value = "";
      updateSelects();
      renderSites();
      alert("✓ Site added");
    }

    function checkout() {
      const toolId = document.getElementById("selectTool").value;
      const siteId = document.getElementById("selectSite").value;
      
      if (!toolId || !siteId) { alert("Select tool and site"); return; }
      
      const tool = state.tools.find(t => t.id == toolId);
      const site = state.sites.find(s => s.id == siteId);
      const user = state.staff.find(u => u.id === state.currentUserId);
      
      tool.checkedOutBy = state.currentUserId;
      tool.checkedOutAt = new Date().toISOString();
      tool.checkedOutSite = siteId;
      
      state.logs.push({
        timestamp: new Date().toISOString(),
        action: "CHECKOUT",
        toolName: tool.name,
        userName: user.name,
        siteName: site.name
      });
      
      save();
      updateSelects();
      alert("✓ Checked out");
    }

    function returnTool(toolId) {
      const tool = state.tools.find(t => t.id == toolId);
      const user = state.staff.find(u => u.id === state.currentUserId);
      const site = state.sites.find(s => s.id === tool.checkedOutSite);
      
      state.logs.push({
        timestamp: new Date().toISOString(),
        action: "RETURN",
        toolName: tool.name,
        userName: user.name,
        siteName: site.name
      });
      
      tool.checkedOutBy = null;
      tool.checkedOutAt = null;
      tool.checkedOutSite = null;
      
      save();
      updateSelects();
      renderReturn();
      alert("✓ Returned");
    }

    function renderReturn() {
      const myTools = state.tools.filter(t => t.checkedOutBy === state.currentUserId);
      const cont = document.getElementById("myTools");
      
      cont.innerHTML = myTools.length === 0 ?
        "<p class='empty'>No tools checked out</p>" :
        myTools.map(t => {
          const site = state.sites.find(s => s.id == t.checkedOutSite);
          return `
            <div class="tool-item">
              <div class="tool-name">${t.name}</div>
              <div class="tool-status">Site: ${site.name}</div>
              <button class="button" style="background:#238636;margin-top:8px;" onclick="returnTool(${t.id})">✓ Return</button>
            </div>
          `;
        }).join("");
    }

    function renderTools() {
      const cont = document.getElementById("allTools");
      cont.innerHTML = state.tools.length === 0 ?
        "<p class='empty'>No tools added yet</p>" :
        state.tools.map(t => `
          <div class="tool-item">
            <div class="tool-name">${t.name}</div>
            <div class="tool-status">${t.checkedOutBy ? 
              "Out to " + state.staff.find(u => u.id === t.checkedOutBy).name : 
              "Available"}</div>
          </div>
        `).join("");
    }

    function renderSites() {
      const cont = document.getElementById("sitesList");
      cont.innerHTML = state.sites.length === 0 ?
        "<p class='empty'>No sites added yet</p>" :
        state.sites.map(s => {
          const count = state.tools.filter(t => t.checkedOutSite == s.id).length;
          return `
            <div class="tool-item">
              <div class="tool-name">${s.name}</div>
              <div class="tool-status">${count} tool${count !== 1 ? "s" : ""}</div>
            </div>
          `;
        }).join("");
    }

    function renderHistory() {
      const cont = document.getElementById("historyList");
      const recent = [...state.logs].reverse().slice(0, 20);
      
      cont.innerHTML = recent.length === 0 ?
        "<p class='empty'>No activity</p>" :
        recent.map(l => `
          <div class="tool-item">
            <div class="tool-name">${l.action === "CHECKOUT" ? "📤" : "📥"} ${l.toolName}</div>
            <div class="tool-status">${l.userName} - ${l.siteName}</div>
            <div class="tool-status">${new Date(l.timestamp).toLocaleString()}</div>
          </div>
        `).join("");
    }

    function exportData() {
      const json = JSON.stringify({exported: new Date().toISOString(), data: state}, null, 2);
      const blob = new Blob([json], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cdc-backup-" + new Date().toISOString().split("T")[0] + ".json";
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const imp = JSON.parse(evt.target.result);
          state = {...state, ...imp.data};
          save();
          alert("✓ Imported");
          renderLoginScreen();
        } catch(e) {
          alert("Error: " + e.message);
        }
      };
      reader.readAsText(file);
    }

    function getColor(id) {
      const colors = ["#0d66d0", "#1f6feb", "#388bfd", "#58a6ff", "#79c0ff", "#a5d6ff"];
      return colors[id.charCodeAt(id.length - 1) % colors.length];
    }

    load();
    renderLoginScreen();
  </script>
</body>
</html>
