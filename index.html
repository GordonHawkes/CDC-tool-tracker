<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDC ToolTrack</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { 
      background: #0f1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .header { 
      background: #161b22; padding: 16px; border-bottom: 1px solid #30363d;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-size: 18px; font-weight: 600; flex: 1; text-align: center; }
    .user-btn { background: #1f6feb; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .content { flex: 1; overflow-y: auto; padding: 16px; }
    .login-screen { display: none; }
    .login-screen.show { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100%; }
    .app-screen { display: none; }
    .app-screen.show { display: flex; flex-direction: column; }
    .logo { width: 80px; height: 80px; margin: 0 auto 24px; border-radius: 12px; background: #1f6feb; display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .title { font-size: 24px; font-weight: 600; margin-bottom: 8px; text-align: center; }
    .subtitle { color: #8b949e; margin-bottom: 24px; text-align: center; }
    .staff-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; }
    .staff-item { 
      background: #161b22; border: 1px solid #30363d; padding: 16px; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s;
    }
    .staff-item:active { background: #0d419f; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: white; flex-shrink: 0; }
    .staff-info { flex: 1; }
    .staff-name { font-weight: 600; margin-bottom: 4px; }
    .staff-role { color: #8b949e; font-size: 13px; }
    .tabs { display: flex; gap: 8px; border-bottom: 1px solid #30363d; margin-bottom: 16px; overflow-x: auto; }
    .tab { padding: 8px 12px; cursor: pointer; border: none; background: none; color: #8b949e; font-size: 13px; white-space: nowrap; border-bottom: 2px solid transparent; }
    .tab.active { color: #1f6feb; border-bottom-color: #1f6feb; }
    .section-title { font-size: 13px; font-weight: 600; color: #8b949e; margin: 16px 0 8px 0; text-transform: uppercase; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 13px; margin-bottom: 4px; }
    .input-group input, .input-group select { 
      width: 100%; padding: 8px 12px; background: #0d1b2a; border: 1px solid #30363d;
      color: #e6edf3; border-radius: 6px; font-size: 14px;
    }
    .button { 
      width: 100%; padding: 12px; background: #1f6feb; color: white; border: none;
      border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 12px;
    }
    .button:active { background: #0d419f; }
    .tool-item { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; margin-bottom: 8px; }
    .tool-name { font-weight: 600; margin-bottom: 4px; }
    .tool-status { font-size: 12px; color: #8b949e; }
    .tab-content { display: none; }
    .tab-content.show { display: block; }
    .empty { color: #8b949e; font-style: italic; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div style="width: 40px;"></div>
      <div class="header-title">CDC ToolTrack</div>
      <button class="user-btn" id="userBtn" onclick="logout()"></button>
    </div>
    <div class="content">
      <!-- LOGIN -->
      <div class="login-screen show" id="loginScreen">
        <div style="width: 100%; max-width: 400px;">
          <div class="logo">🔧</div>
          <div class="title">CDC ToolTrack</div>
          <div class="subtitle">Tap your name to sign in</div>
          <div class="staff-grid" id="staffGrid">
            <p style="text-align: center; color: #8b949e;">Loading...</p>
          </div>
        </div>
      </div>

      <!-- APP -->
      <div class="app-screen" id="appScreen">
        <div class="tabs" id="tabBar"></div>

        <!-- CHECKOUT TAB -->
        <div class="tab-content show" id="tab-checkout">
          <div class="section-title">📤 Check Out Tool</div>
          <div class="input-group">
            <label>Tool:</label>
            <select id="selectTool">
              <option value="">Choose tool...</option>
            </select>
          </div>
          <div class="input-group">
            <label>Site:</label>
            <select id="selectSite">
              <option value="">Choose site...</option>
            </select>
          </div>
          <button class="button" onclick="checkoutTool()">✓ Check Out</button>
        </div>

        <!-- RETURN TAB -->
        <div class="tab-content" id="tab-return">
          <div class="section-title">📥 My Tools</div>
          <div id="myTools"></div>
        </div>

        <!-- TOOLS TAB -->
        <div class="tab-content" id="tab-tools">
          <div class="section-title">🔧 All Tools</div>
          <div id="allTools"></div>
        </div>

        <!-- SITES TAB -->
        <div class="tab-content" id="tab-sites">
          <div class="section-title">🏗️ Job Sites</div>
          <div id="sitesList"></div>
        </div>

        <!-- HISTORY TAB -->
        <div class="tab-content" id="tab-history">
          <div class="section-title">📋 Activity</div>
          <div id="historyList"></div>
        </div>

        <!-- SETTINGS TAB -->
        <div class="tab-content" id="tab-settings">
          <div class="section-title">⚙️ Settings</div>
          <button class="button" onclick="exportData()">⬇️ Export Backup</button>
          <button class="button" onclick="document.getElementById('importFile').click()">⬆️ Import Backup</button>
          <input type="file" id="importFile" style="display:none" onchange="importData(event)">
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>

  <script>
    // ============ FIREBASE ============
    const firebaseConfig = {
      apiKey: "AIzaSyDDaNFeThITc0JZXmFRjG-_vKhDEhQ9CBk",
      authDomain: "cdc-tool-tracker.firebaseapp.com",
      databaseURL: "https://cdc-tool-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cdc-tool-tracker"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ============ DATA ============
    const STAFF = [
      {id:"adm-001", name:"Christophe Dinh", role:"Owner"},
      {id:"adm-002", name:"Gordon Hawkes", role:"Manager"},
      {id:"ps-001", name:"Peter Samson", role:"Permanent Staff"},
      {id:"ps-002", name:"Kalo Rano", role:"Permanent Staff"},
      {id:"ps-003", name:"Tevi Kaltariki", role:"Permanent Staff"},
      {id:"ps-004", name:"Staff 4", role:"Permanent Staff"},
      {id:"ps-005", name:"Staff 5", role:"Permanent Staff"},
      {id:"ps-006", name:"Staff 6", role:"Permanent Staff"},
      {id:"ps-007", name:"Staff 7", role:"Permanent Staff"},
      {id:"ps-008", name:"Staff 8", role:"Permanent Staff"},
      {id:"ps-009", name:"Staff 9", role:"Permanent Staff"},
      {id:"ps-010", name:"Staff 10", role:"Permanent Staff"},
      {id:"ps-011", name:"Staff 11", role:"Permanent Staff"},
      {id:"ps-012", name:"Staff 12", role:"Permanent Staff"}
    ];

    let state = {
      currentUserId: null,
      tools: [
        {id: 1, name: "Drill", checkedOutBy: null, checkedOutAt: null, checkedOutSite: null},
        {id: 2, name: "Saw", checkedOutBy: null, checkedOutAt: null, checkedOutSite: null},
        {id: 3, name: "Hammer", checkedOutBy: null, checkedOutAt: null, checkedOutSite: null},
        {id: 4, name: "Level", checkedOutBy: null, checkedOutAt: null, checkedOutSite: null},
        {id: 5, name: "Tape Measure", checkedOutBy: null, checkedOutAt: null, checkedOutSite: null}
      ],
      sites: [
        {id: "all", name: "All Sites"},
        {id: "warehouse", name: "Main Warehouse"},
        {id: "s1", name: "Site A"},
        {id: "s2", name: "Site B"}
      ],
      logs: []
    };

    const KEY = "cdc_tooltrack";

    // ============ INIT ============
    function init() {
      loadState();
      renderLoginScreen();
      setInterval(() => {
        if (navigator.onLine && state.currentUserId) syncToFirebase();
      }, 5000);
    }

    // ============ STORAGE ============
    function saveState() {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        syncToFirebase();
      } catch(e) {
        console.error("Save:", e);
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(KEY);
        if (saved) state = JSON.parse(saved);
      } catch(e) {
        console.error("Load:", e);
      }
    }

    async function syncToFirebase() {
      if (!navigator.onLine) return;
      try {
        await db.ref("data").set({
          tools: state.tools,
          sites: state.sites,
          logs: state.logs,
          lastUpdated: new Date().toISOString()
        });
      } catch(e) {
        console.error("Firebase:", e);
      }
    }

    // ============ LOGIN ============
    function renderLoginScreen() {
      document.getElementById("loginScreen").classList.add("show");
      document.getElementById("appScreen").classList.remove("show");
      
      const grid = document.getElementById("staffGrid");
      grid.innerHTML = STAFF.map(u => `
        <div class="staff-item" onclick="login('${u.id}')">
          <div class="avatar" style="background: ${getColor(u.id)}">${u.name[0]}</div>
          <div class="staff-info">
            <div class="staff-name">${u.name}</div>
            <div class="staff-role">${u.role}</div>
          </div>
        </div>
      `).join("");
    }

    function login(userId) {
      state.currentUserId = userId;
      saveState();
      renderAppScreen();
    }

    function logout() {
      state.currentUserId = null;
      saveState();
      renderLoginScreen();
    }

    // ============ APP ============
    function renderAppScreen() {
      document.getElementById("loginScreen").classList.remove("show");
      document.getElementById("appScreen").classList.add("show");
      
      const user = STAFF.find(u => u.id === state.currentUserId);
      document.getElementById("userBtn").textContent = user.name.split(" ")[0];
      
      renderTabs();
      updateSelects();
      showTab("checkout");
    }

    function renderTabs() {
      const tabs = [
        {id: "checkout", label: "📤 Checkout"},
        {id: "return", label: "📥 Return"},
        {id: "tools", label: "🔧 Tools"},
        {id: "sites", label: "🏗️ Sites"},
        {id: "history", label: "📋 History"},
        {id: "settings", label: "⚙️ Settings"}
      ];
      
      document.getElementById("tabBar").innerHTML = tabs.map(t => 
        `<button class="tab" onclick="showTab('${t.id}')">${t.label}</button>`
      ).join("");
    }

    function showTab(tab) {
      document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("show"));
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("show");
      if (event && event.target) event.target.classList.add("active");
      
      if (tab === "return") renderReturn();
      else if (tab === "tools") renderTools();
      else if (tab === "sites") renderSites();
      else if (tab === "history") renderHistory();
    }

    function updateSelects() {
      const toolSel = document.getElementById("selectTool");
      const siteSel = document.getElementById("selectSite");
      
      toolSel.innerHTML = "<option value=''>Choose tool...</option>" + 
        state.tools.filter(t => !t.checkedOutBy).map(t => 
          `<option value="${t.id}">${t.name}</option>`
        ).join("");
      
      siteSel.innerHTML = "<option value=''>Choose site...</option>" + 
        state.sites.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
    }

    function checkoutTool() {
      const toolId = document.getElementById("selectTool").value;
      const siteId = document.getElementById("selectSite").value;
      
      if (!toolId || !siteId) { alert("Select tool and site"); return; }
      
      const tool = state.tools.find(t => t.id == toolId);
      const site = state.sites.find(s => s.id === siteId);
      const user = STAFF.find(u => u.id === state.currentUserId);
      
      tool.checkedOutBy = state.currentUserId;
      tool.checkedOutAt = new Date().toISOString();
      tool.checkedOutSite = siteId;
      
      state.logs.push({
        timestamp: new Date().toISOString(),
        action: "CHECKOUT",
        toolName: tool.name,
        userName: user.name,
        siteName: site.name
      });
      
      saveState();
      updateSelects();
      alert("✓ Checked out");
    }

    function returnTool(toolId) {
      const tool = state.tools.find(t => t.id == toolId);
      const user = STAFF.find(u => u.id === state.currentUserId);
      const site = state.sites.find(s => s.id === tool.checkedOutSite);
      
      state.logs.push({
        timestamp: new Date().toISOString(),
        action: "RETURN",
        toolName: tool.name,
        userName: user.name,
        siteName: site.name
      });
      
      tool.checkedOutBy = null;
      tool.checkedOutAt = null;
      tool.checkedOutSite = null;
      
      saveState();
      updateSelects();
      renderReturn();
      alert("✓ Returned");
    }

    function renderReturn() {
      const myTools = state.tools.filter(t => t.checkedOutBy === state.currentUserId);
      const cont = document.getElementById("myTools");
      
      cont.innerHTML = myTools.length === 0 ? 
        "<div class='empty'>No tools checked out</div>" :
        myTools.map(t => {
          const site = state.sites.find(s => s.id === t.checkedOutSite);
          return `
            <div class="tool-item">
              <div class="tool-name">${t.name}</div>
              <div class="tool-status">Site: ${site.name}</div>
              <button class="button" style="background:#238636" onclick="returnTool('${t.id}')">✓ Return</button>
            </div>
          `;
        }).join("");
    }

    function renderTools() {
      document.getElementById("allTools").innerHTML = state.tools.map(t => `
        <div class="tool-item">
          <div class="tool-name">${t.name}</div>
          <div class="tool-status">${t.checkedOutBy ? 
            "Out to " + STAFF.find(u => u.id === t.checkedOutBy).name : 
            "Available"}</div>
        </div>
      `).join("");
    }

    function renderSites() {
      document.getElementById("sitesList").innerHTML = state.sites.map(s => {
        const count = state.tools.filter(t => t.checkedOutSite === s.id).length;
        return `
          <div class="tool-item">
            <div class="tool-name">${s.name}</div>
            <div class="tool-status">${count} tool${count !== 1 ? "s" : ""}</div>
          </div>
        `;
      }).join("");
    }

    function renderHistory() {
      const recent = [...state.logs].reverse().slice(0, 20);
      document.getElementById("historyList").innerHTML = recent.length === 0 ?
        "<div class='empty'>No activity</div>" :
        recent.map(l => `
          <div class="tool-item">
            <div class="tool-name">${l.action === "CHECKOUT" ? "📤" : "📥"} ${l.toolName}</div>
            <div class="tool-status">${l.userName} - ${l.siteName}</div>
            <div class="tool-status">${new Date(l.timestamp).toLocaleString()}</div>
          </div>
        `).join("");
    }

    function exportData() {
      const json = JSON.stringify({exported: new Date().toISOString(), data: state}, null, 2);
      const blob = new Blob([json], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cdc-backup-" + new Date().toISOString().split("T")[0] + ".json";
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const imp = JSON.parse(evt.target.result);
          state = {...state, ...imp.data};
          saveState();
          alert("✓ Imported");
        } catch(e) {
          alert("Error: " + e.message);
        }
      };
      reader.readAsText(file);
    }

    function getColor(id) {
      const colors = ["#0d66d0", "#1f6feb", "#388bfd", "#58a6ff", "#79c0ff", "#a5d6ff"];
      return colors[id.charCodeAt(id.length - 1) % colors.length];
    }

    // START
    init();
  </script>
</body>
</html>
